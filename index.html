    <!-- Runtime Fix: Prevent "Cannot set property fetch of #<Window> which has only a getter" -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          if (typeof nativeFetch === 'function') {
            nativeFetch = nativeFetch.bind(window);
          }
          var _currentFetch = nativeFetch;

          // 1. Ensure Window.prototype allows both getter and setter for fetch
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && (!protoDesc.writable || !protoDesc.set)) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _currentFetch; },
                  set: function(fn) { _currentFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }

          // 2. Ensure window instance has a setter and getter for fetch
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(fn) { _currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        } catch (e) {
          console.warn('Window fetch patch bypassed:', e);
        }
      })();
    </script>
